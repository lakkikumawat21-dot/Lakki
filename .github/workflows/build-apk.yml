name: Build Hermes Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Ad-Free Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download Gradle Wrapper JAR if needed
        run: |
          cd android-app
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Generated
        run: |
          ls -la android-app/app/build/outputs/apk/debug/
          APK_PATH=$(find android-app/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file was generated!" >&2
            exit 1
          fi
          echo "Generated APK: $APK_PATH"
          echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-adfree-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-apk"
          name: "Hermes Agent v1.0.0 (Ad-Free Android APK)"
          body: |
            ## Hermes Agent v1.0.0 — Ad-Free Android Release
            
            - **Package:** `ai.sol.hermes`
            - **Dashboard Bridge:** `http://127.0.0.2:39067`
            - **Capability Server:** Port `43097` (`/health`, `/device-info`, `/notify`, `/toast`, `/alarm`, `/clipboard`)
            - **Ads / Trackers:** 0 (100% Ad-Free, Open Source)
          files: android-app/app/build/outputs/apk/debug/*.apk
        continue-on-error: true
